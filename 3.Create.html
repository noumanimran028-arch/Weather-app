<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Signup UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

/* BACKGROUND */
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background: linear-gradient(135deg, #9700ff, #00f2fe, #9700ff);
    background-size:250% 250%;
    animation:moveBg 14s ease infinite;

    padding:20px;
}

/* overlay */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.22);
    pointer-events:none;
}

@keyframes moveBg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* CARD */
.container{
    width:500px;
    max-width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,0.15);
    border-radius:16px;

    padding:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

/* BOXES */
.box{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:10px;
}

/* RIGHT BOX STYLE */
.box.signup{
    background:rgba(255,255,255,0.10);
    border-radius:14px;
}

/* HEADINGS */
h2, p{
    color:white;
    text-align:center;
    margin-bottom:10px;
}

/* INPUTS */
input{
    width:100%;
    padding:10px 12px;

    border-radius:10px;
    border:1px solid rgba(255,255,255,0.2);

    background:rgba(255,255,255,0.08);
    color:white;

    outline:none;
}

input::placeholder{
    color:rgba(255,255,255,0.6);
}

input:focus{
    border-color:#9700ff;
    box-shadow:0 0 10px rgba(151,0,255,0.4);
}

/* BUTTON */
button{
    padding:10px;
    border:none;
    border-radius:12px;

    background:#9700ff;
    color:white;

    cursor:pointer;
    font-weight:bold;

    transition:transform 0.6s ease, box-shadow 0.6s ease;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 10px rgba(151,0,255,0.5);
}

/* RESPONSIVE */
@media(max-width:768px){
    .container{
        grid-template-columns:1fr;
    }
}
</style>

</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div class="box">
        <h2>Login</h2>
        <input type="email" placeholder="Enter email">
        <input type="password" placeholder="Enter password">
        <button>Login</button>
    </div>

    <!-- SIGNUP -->
    <div class="box signup">
        <p>Sign Up</p>
        <input type="text" placeholder="Enter name">
        <input type="email" placeholder="Enter email">
        <input type="password" placeholder="Enter password">
        <button>Sign Up</button>
    </div>

</div>

</body>
</html>
